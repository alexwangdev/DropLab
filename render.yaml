# Render blueprint for DropLab. Not deployed: deploy from your own Render account.
# Secrets are not stored here. Set them in the Render dashboard (sync: false).
services:
  - type: web
    name: droplab-api
    runtime: node
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: PAYPAL_ENV
        value: sandbox
      - key: CLIENT_ORIGIN
        fromService:
          type: web
          name: droplab-web
          property: host
      - key: DATABASE_URL
        fromDatabase:
          name: droplab-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1/
      - key: NEBIUS_MODEL
        value: nvidia/Nemotron-3_5-Lightning
      - key: PAYOUT_CREATOR_EMAIL
        sync: false
      - key: PAYOUT_SUPPLIER_EMAIL
        sync: false
      - key: PAYOUT_PLATFORM_EMAIL
        sync: false

  - type: web
    name: droplab-web
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      # Single-page app: send unknown paths to index.html
      - type: rewrite
        source: /*
        destination: /index.html

  - type: cron
    name: droplab-price-recheck
    runtime: node
    rootDir: server
    schedule: "0 9 * * *"   # daily 09:00 UTC
    buildCommand: npm ci && npm run build
    startCommand: node dist/price-recheck.js
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: droplab-db
          property: connectionString
      - key: CHANNEL3_API_KEY
        sync: false

databases:
  - name: droplab-db
    databaseName: droplab
    plan: free
