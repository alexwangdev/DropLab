# Render blueprint for DropLab: one web service (the API and the built React client on the same origin), a Postgres
# database, and a daily Channel3 price re-check. Deploy from your own Render account: Dashboard -> New -> Blueprint.
#
# Secrets are not stored here. Every `sync: false` key is asked for when you apply the blueprint; copy the values from
# your local .env. CLIENT_ORIGIN is not needed: the server uses Render's RENDER_EXTERNAL_URL (its own https URL).
#
# Free tier limits (render.com/docs/free): a free web service sleeps after 15 minutes without traffic and takes about a
# minute to wake; a free Postgres database expires 30 days after creation. Judging runs to 15 December, so upgrade the
# database (and ideally the web service) to a paid instance type before then.
services:
  - type: web
    name: droplab
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server && npm ci --prefix client && npm run build --prefix server && npm run build --prefix client
    startCommand: node server/dist/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: PAYPAL_ENV
        value: sandbox
      - key: DATABASE_URL
        fromDatabase:
          name: droplab-db
          property: connectionString
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: CHANNEL3_API_KEY
        sync: false
      - key: NEBIUS_API_KEY
        sync: false
      - key: NEBIUS_BASE_URL
        value: https://api.tokenfactory.nebius.com/v1/
      - key: NEBIUS_MODEL
        value: nvidia/Nemotron-3_5-Lightning
      - key: PAYOUT_CREATOR_EMAIL
        sync: false
      - key: PAYOUT_SUPPLIER_EMAIL
        sync: false
      - key: PAYOUT_PLATFORM_EMAIL
        sync: false
      # Trial licence keys for AG Grid, AG Studio and Bryntum. Served to the browser by GET /api/client-config.
      - key: AG_GRID_LICENSE_KEY
        sync: false
      - key: AG_STUDIO_LICENSE_KEY
        sync: false
      - key: BRYNTUM_LICENSE_KEY
        sync: false

  - type: cron
    name: droplab-price-recheck
    runtime: node
    schedule: "0 9 * * *"   # daily 09:00 UTC
    buildCommand: npm ci --prefix server && npm run build --prefix server
    startCommand: node server/dist/price-recheck.js
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: PAYPAL_ENV
        value: sandbox
      - key: DATABASE_URL
        fromDatabase:
          name: droplab-db
          property: connectionString
      - key: CHANNEL3_API_KEY
        sync: false

databases:
  - name: droplab-db
    databaseName: droplab
    plan: free
